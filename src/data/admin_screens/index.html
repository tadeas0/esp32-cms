<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            type="text/css"
            rel="stylesheet"
            href="/css/materialize.min.css"
            media="screen,projection"
        />
        <link type="text/css" rel="stylesheet" href="/icons/icons.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Index</title>
        <script
            type="text/javascript"
            src="/jslib/jquery.min.js"
            defer
        ></script>

            src="/jslib/materialize.min.js"

        ></script>
        <script type="text/javascript" src="/js/admin_index.js" defer></script>
    </head>
    <body>
        <header>
            <nav>
                <div class="nav-wrapper teal">
                    <span class="brand-logo center">Your articles</span>
                    <ul class="left">
                        <li>
                            <a href="/">

                    </ul>
                    <ul class="right">

                </div>
            </nav>
        </header>
        <main>
            <div class="container">

                    <div class="card">

                            <span class="card-title">Memory</span>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="divider"></div>
                <div id="article-list" class="section"></div>
            </div>
            <div class="fixed-action-btn">
                <a
